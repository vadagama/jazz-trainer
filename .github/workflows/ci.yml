name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-

      - name: Install dependencies
        # npm ci can miss platform-specific optional deps (npm bug #4828).
        # npm install re-resolves fresh and includes all native binaries.
        run: npm install --prefer-offline

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm run test

  deploy-api:
    needs: verify
    # Фаза 6: ручной деплой-гейт — API деплоится только через workflow_dispatch.
    # Авто-деплой при push в main отключён для защиты продакшена.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm i -g @railway/cli

      # Фаза 6.4.2: миграции применяются до деплоя API.
      # Если миграции упали — API не деплоится.
      - name: Run DB migrations (prod)
        run: railway run --service amazilia-api "npm run db:migrate -- -w @jazz/api"
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Deploy to Railway (prod)
        run: railway up --service amazilia-api
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
