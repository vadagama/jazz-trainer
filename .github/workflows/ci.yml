name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Ежедневный бэкап БД в 03:00 UTC
    - cron: '0 3 * * *'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-

      - name: Verify lockfile integrity
        # Catch package.json / lockfile mismatch with an actionable error.
        # npm ci --dry-run exits non-zero when lockfile is out of sync.
        run: |
          npm ci --dry-run --ignore-scripts > /dev/null 2>&1 || {
            echo "::error::package-lock.json is out of sync with package.json"
            echo "::error::Run 'npm install' locally and commit the updated lockfile."
            exit 1
          }

      - name: Install dependencies
        # npm ci: strict install from lockfile.
        # 2x faster than npm install, fully deterministic.
        run: npm ci

      - name: Typecheck
        # Fail fast: stop at first workspace error instead of running all in parallel.
        run: npm run typecheck -- --workspace-concurrency=1

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm run test

      # Фаза 9: уведомление в Telegram при падении CI (verify)
      - name: Notify Telegram (verify failed)
        if: failure()
        run: bash infra/scripts/notify-telegram.sh "❌ CI verify failed on ${{ github.ref_name }}" "error"
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

  deploy-api:
    needs: verify
    # Фаза 6: ручной деплой-гейт — API деплоится только через workflow_dispatch.
    # Авто-деплой при push в main отключён для защиты продакшена.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm i -g @railway/cli

      # Фаза 8.2: бэкап БД перед деплоем на случай отката с изменением схемы.
      # Бэкап сохраняется на Railway Volume в /app/data/ рядом с основным файлом.
      # Имя файла включает unix-timestamp для уникальности.
      - name: Backup DB before deploy
        run: |
          railway run --service amazilia-api-prod \
            "cp /app/data/jazz-trainer.sqlite /app/data/jazz-trainer-backup-\$(date +%s).sqlite"
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      # Railway сам отслеживает health-check и не заменит старый деплой,
      # если новый контейнер не станет здоровым (авто-откат).
      # Миграции применяются сервером при старте (src/index.ts: runMigrations).
      - name: Deploy to Railway (prod)
        run: railway up --service amazilia-api-prod
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      # Фаза 9: уведомление в Telegram при успешном деплое
      - name: Notify Telegram (deploy success)
        if: success()
        run: bash infra/scripts/notify-telegram.sh "✅ API deployed to Railway" "success"
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      # Фаза 9: уведомление в Telegram при падении деплоя
      - name: Notify Telegram (deploy failed)
        if: failure()
        run: bash infra/scripts/notify-telegram.sh "❌ API deploy to Railway failed" "error"
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

  # Фаза 10: ежедневный бэкап БД по расписанию (cron)
  # Создаёт бэкап на Railway Volume и скачивает как артефакт GitHub Actions (30 дней хранения).
  backup-db:
    # Только по расписанию или вручную через workflow_dispatch.
    # Не запускается на PR/push — только deploy-api делает бэкап перед деплоем.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm i -g @railway/cli

      - name: Generate backup filename
        run: echo "BACKUP_NAME=jazz-trainer-backup-$(date +%s).sqlite" >> $GITHUB_ENV

      - name: Create backup on Railway Volume
        # Fallback: skip if DB file doesn't exist yet (e.g. first deploy not done).
        run: |
          railway run --service amazilia-api-prod \
            "if [ -f /app/data/jazz-trainer.sqlite ]; then cp /app/data/jazz-trainer.sqlite /app/data/$BACKUP_NAME; else echo '[backup] No DB file — skipping'; fi"
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Download backup
        # Skip download if backup was not created.
        run: |
          if railway run --service amazilia-api-prod "test -f /app/data/$BACKUP_NAME" 2>/dev/null; then
            railway run --service amazilia-api-prod "cat /app/data/$BACKUP_NAME" > "$BACKUP_NAME"
          else
            echo "[backup] No backup file to download - skipping"
          fi
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Upload backup as artifact
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ github.run_id }}
          path: ${{ env.BACKUP_NAME }}
          retention-days: 30
          if-no-files-found: ignore

      - name: Cleanup old backups on Railway Volume (keep last 7)
        run: |
          railway run --service amazilia-api-prod \
            "ls -t /app/data/jazz-trainer-backup-*.sqlite 2>/dev/null | tail -n +8 | xargs -r rm" || true
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Notify Telegram (backup success)
        if: success()
        run: bash infra/scripts/notify-telegram.sh "✅ Daily DB backup completed" "success"
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Notify Telegram (backup failed)
        if: failure()
        run: bash infra/scripts/notify-telegram.sh "❌ Daily DB backup failed" "error"
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
